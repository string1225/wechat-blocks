<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>智能消方块</title>
    <link rel="icon" type="image/png" href="assets/app-avatar.png" />
    <style>
      :root { color: #f2f7ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #282d58; }
      #app { position: relative; touch-action: none; }
      #game-canvas { display: block; width: 100%; height: 100%; outline: none; }
      button { font: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; transition: background .18s, color .18s, transform .18s; }
      button:active:not(:disabled) { transform: scale(.96); }
      button:focus-visible { outline: 2px solid #95f5cd; outline-offset: 3px; }
      button:disabled { cursor: default; color: #8490af; }
      .hud { pointer-events: none; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: max(14px, env(safe-area-inset-top)) 12px max(18px, calc(env(safe-area-inset-bottom) + 18px)); }
      .topbar, .toolbar { pointer-events: auto; width: min(100%, 440px); border: 1px solid #465071; border-radius: 22px;
        background: #202744; box-shadow: 0 12px 36px #0d163326; }
      .topbar { height: 136px; padding: 10px 12px 8px; }
      .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; margin-bottom: 10px; }
      .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .brand img { width: 34px; height: 34px; border-radius: 11px; }
      .brand-copy { display: grid; gap: 3px; }
      .brand span { font-size: 17px; font-weight: 750; white-space: nowrap; }
      .brand small { font-size: 10px; color: #aab8d3; letter-spacing: 1px; }
      .timer-chip { flex: 0 0 80px; display: grid; height: 44px; text-align: center; align-content: center; gap: 1px; background: #2b3455; border-radius: 12px; }
      .timer-chip strong { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .timer-chip small { font-size: 10px; color: #aab8d3; }
      .stats { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .difficulty-stepper { display: grid; grid-template-columns: 32px minmax(60px, 92px) 32px; gap: 4px; align-items: center; }
      .chip { display: flex; height: 36px; align-items: center; justify-content: center; gap: 4px; font-size: 13px; white-space: nowrap; }
      .chip strong { font-size: 15px; }
      .remaining { padding: 0 10px; background: #2b3455; border-radius: 12px; }
      .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; padding: 0 4px; height: 22px; font-size: 12px; color: #aab8d3; }
      .stars { color: #ffd18c; font-size: 16px; letter-spacing: 3px; }
      .icon-button { display: flex; align-items: center; justify-content: center; width: 32px; height: 36px; border: 1px solid #465071;
        border-radius: 12px; background: #333d60; color: #f2f7ff; }
      .icon-button svg { width: 18px; height: 18px; stroke-width: 2; }
      .toolbar { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; padding: 8px 8px 4px; height: 106px; }
      .tool-button { min-width: 0; height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
        border: 1px solid #465071; border-radius: 15px; padding: 7px 2px; background: #333d60; color: #f2f7ff; }
      .tool-button svg { width: 20px; height: 20px; stroke-width: 1.8; }
      .tool-copy { display: grid; text-align: center; gap: 4px; }
      .tool-copy b { font-size: 14px; line-height: 1; }
      .tool-copy span { font-size: 10px; color: #aab8d3; white-space: nowrap; }
      .tool-button:disabled .tool-copy span { color: #75809e; }
      .tool-button[data-active="true"] { background: #95f5cd; color: #173e34; border-color: #95f5cd; }
      .tool-button[data-active="true"] .tool-copy span { color: #32604e; }
      #hud-bomb[data-active="true"] { background: #ffd18c; border-color: #ffd18c; }
      .gesture-hint { grid-column: 1 / -1; text-align: center; font-size: 10px; color: #aab8d3; line-height: 12px; }
      .zoom-controls { position: absolute; right: 14px; bottom: max(140px, calc(env(safe-area-inset-bottom) + 140px)); display: flex; gap: 6px; }
      .zoom-controls .icon-button { background: #202744; height: 30px; width: 30px; opacity: .85; }
      .toast { pointer-events: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 14px;
        padding: 12px 18px; background: #202744ed; opacity: 0; transition: opacity .16s; font-size: 14px; }
      .toast[data-visible="true"] { opacity: 1; }
      .bomb-hint { position: absolute; top: max(158px, calc(env(safe-area-inset-top) + 144px)); left: 50%; transform: translateX(-50%);
        padding: 8px 12px; border-radius: 12px; color: #173e34; background: #ffd18c; font-size: 12px; white-space: nowrap; pointer-events: none; }
      .result { position: absolute; inset: 0; display: none; place-items: center; padding: 20px; background: #0c1228a6; }
      .result[data-visible="true"] { display: grid; }
      #bomb-dialog { align-items: end; padding-bottom: max(140px, calc(env(safe-area-inset-bottom) + 140px)); }
      .result-panel { width: min(340px,100%); border: 1px solid #465071; border-radius: 22px; padding: 28px 20px 20px; background: #202744; text-align: center; box-shadow: 0 24px 70px #0c12285c; }
      .result-panel h1 { margin: 0 0 14px; font-size: 25px; }
      .result-panel p { margin: 0 0 28px; color: #aab8d3; font-size: 12px; line-height: 1.6; }
      .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .text-button { height: 46px; border: 0; border-radius: 12px; background: #95f5cd; color: #173e34; font-size: 14px; font-weight: 700; }
      .text-button.secondary { color: #f2f7ff; background: #333d60; }
      .text-button:disabled { opacity: .4; }
      .scene-hud-preview #hud, .scene-hud-preview .zoom-controls, .scene-hud-preview #result,
      .scene-hud-preview #bomb-dialog, .scene-hud-preview #bomb-hint, .scene-hud-preview #toast { display: none; }
      @media (max-width: 340px) { .brand img { display: none; } .brand span { font-size: 17px; } .remaining { padding: 0 7px; font-size: 12px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="智能消方块"></canvas>
      <div class="hud" id="hud">
        <header class="topbar">
          <div class="title-row">
          <div class="brand" aria-label="智能消方块">
            <img src="assets/app-avatar.png" alt="" />
            <div class="brand-copy"><span>智能消方块</span><small>3D 空间消除</small></div>
          </div>
          <div class="timer-chip" aria-label="本局用时"><strong id="hud-timer">00:00</strong><small>本局用时</small></div>
          </div>
          <div class="stats" aria-live="polite">
            <div class="difficulty-stepper" aria-label="难度等级">
              <button class="icon-button" id="hud-difficulty-prev" type="button" title="降低难度">
                <i data-lucide="chevron-left"></i>
              </button>
              <span class="chip difficulty-chip">难度 <strong id="hud-difficulty">1</strong></span>
              <button class="icon-button" id="hud-difficulty-next" type="button" title="提高难度">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
            <span class="chip remaining">剩余 <strong id="hud-left">0</strong></span>
          </div>
          <div class="meta-row"><span id="hud-dimensions">尺寸 4 × 4 × 4</span><span class="stars" id="hud-stars">---</span></div>
        </header>
        <footer class="toolbar">
          <button class="tool-button" id="hud-reset" type="button">
            <i data-lucide="refresh-ccw"></i>
            <span class="tool-copy"><b>重置</b><span id="hud-reset-count">重新开始</span></span>
          </button>
          <button class="tool-button" id="hud-undo" type="button">
            <i data-lucide="undo-2"></i>
            <span class="tool-copy"><b>撤销</b><span id="hud-undo-count">5</span></span>
          </button>
          <button class="tool-button" id="hud-bomb" type="button">
            <i data-lucide="bomb"></i>
            <span class="tool-copy"><b>炸弹</b><span id="hud-bomb-count">3</span></span>
          </button>
          <button class="tool-button" id="hud-auto" type="button">
            <i data-lucide="play"></i>
            <span class="tool-copy"><b>自动</b><span id="hud-auto-state">关闭</span></span>
          </button>
          <span class="gesture-hint">拖动自由旋转 · 双指缩放</span>
        </footer>
      </div>
      <div class="zoom-controls" aria-label="缩放">
        <button class="icon-button" id="hud-zoom-in" type="button" title="放大">
          <i data-lucide="zoom-in"></i>
        </button>
        <button class="icon-button" id="hud-zoom-out" type="button" title="缩小">
          <i data-lucide="zoom-out"></i>
        </button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="bomb-hint" id="bomb-hint" hidden>点选要炸的格子 · 再点炸弹可取消</div>
      <section class="result" id="bomb-dialog" role="dialog" aria-modal="true" aria-labelledby="bomb-title">
        <div class="result-panel">
          <h1 id="bomb-title">炸掉这个格子？</h1>
          <p>消耗 1 枚炸弹，只移除高亮的格子</p>
          <div class="result-actions">
            <button class="text-button secondary" id="bomb-cancel" type="button">取消</button>
            <button class="text-button" id="bomb-confirm" type="button">确认炸掉</button>
          </div>
        </div>
      </section>
      <section class="result" id="result">
        <div class="result-panel">
          <h1 id="result-title">过关</h1>
          <p id="result-copy">---</p>
          <div class="result-actions">
            <button class="text-button secondary" id="result-retry" type="button">重玩</button>
            <button class="text-button" id="result-next" type="button">下一难度</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
